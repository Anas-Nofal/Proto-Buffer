
syntax = "proto3";

package org.ds.proto;

option java_package = "org.ds.proto";
option java_outer_classname = "BookProtos";

message Book {

  string title = 1;

  Author author = 2;

  string isbn = 3;

  int32 publication_year = 4;

  Category category = 5;

  repeated string keywords = 6;

  message Author {
    string name = 1;
    string country = 2;
  }

  enum Category {
    CATEGORY_UNSPECIFIED = 0;
    COMPUTER_SCIENCE = 1;
    NETWORKING = 2;
    DATABASES = 3;
    MATHEMATICS = 4;
  }
}
